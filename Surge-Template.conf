[Rule]
# ============================================================
# 优先级：
# 1. PT 直连
# 2. LAN 直连
# 3. NTP 时间服务器直连
# 4. 安全拦截与广告拦截
# 5. 专业分流
# 6. 国内直连
# 7. 兜底代理
# ============================================================

# > 1. PT 站点强制直连
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/PrivateTracker/PrivateTracker.list,PT站点,no-resolve

# > 2. LAN 直连
RULE-SET,LAN,DIRECT

# > 3. NTP 时间服务器直连
# Shadow-TLS 握手对时钟偏差较敏感，确保 NTP 流量不经过代理。
DOMAIN,time.apple.com,DIRECT
DOMAIN,time.windows.com,DIRECT
DOMAIN,time.nist.gov,DIRECT
DOMAIN,ntp.aliyun.com,DIRECT
DOMAIN,cn.pool.ntp.org,DIRECT
DOMAIN,pool.ntp.org,DIRECT

# > 4. Aegis Firewall 安全拦截
RULE-SET,https://raw.githubusercontent.com/Thoseyearsbrian/Aegis/main/rules/CA_Block.list,REJECT,no-resolve
RULE-SET,https://raw.githubusercontent.com/Thoseyearsbrian/Aegis/main/rules/Background_Block.list,REJECT,no-resolve
RULE-SET,https://raw.githubusercontent.com/Thoseyearsbrian/Aegis/main/rules/Malware_IOC_Block.list,REJECT,no-resolve
RULE-SET,https://raw.githubusercontent.com/Thoseyearsbrian/Aegis/main/rules/Phishing_Block.list,REJECT,no-resolve

# > 5. 广告拦截
DOMAIN-SET,https://ruleset.skk.moe/List/domainset/reject.conf,REJECT
RULE-SET,https://ruleset.skk.moe/List/non_ip/reject.conf,REJECT,extended-matching

# > 6. 专业分流
RULE-SET,https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Rules/AIGC.list,智能助理
RULE-SET,https://raw.githubusercontent.com/Thoseyearsbrian/Aegis/main/rules/GitHub.list,GitHub
RULE-SET,https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Rules/YouTube.list,油管视频
RULE-SET,https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Rules/Netflix.list,奈飞视频
RULE-SET,https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Rules/Disney.list,迪士尼+
RULE-SET,https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Rules/BiliBili.list,哔哩哔哩
RULE-SET,https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Rules/TelegramASN.list,电报信息
RULE-SET,https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Rules/Google.list,谷歌服务
RULE-SET,https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Rules/Apple.list,苹果服务
RULE-SET,https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Rules/Microsoft.list,微软服务
RULE-SET,https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Rules/Game.list,游戏平台

# > 7. 其他媒体
RULE-SET,https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Rules/GlobalMedia.list,国外媒体
RULE-SET,https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Rules/ChinaMedia.list,国内媒体

# > 8. 代理候补
RULE-SET,https://raw.githubusercontent.com/Thoseyearsbrian/Aegis/main/rules/Proxy.list,节点选择

# > 9. 直连与国内
RULE-SET,https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Rules/China.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Rules/ChinaCIDR.list,DIRECT,no-resolve
GEOIP,CN,DIRECT

# > 10. 兜底
FINAL,节点选择,dns-failed

[Host]
# > 阿里 DNS 加速
dns.alidns.com = 223.5.5.5

# > NTP 时间服务器使用系统解析
# 与规则层直连配合，降低时间同步受代理链路影响的概率。
time.apple.com = server:system
time.windows.com = server:system
time.nist.gov = server:system
ntp.aliyun.com = server:system
cn.pool.ntp.org = server:system
pool.ntp.org = server:system

# > Google 域名使用系统解析兜底
*.google.com = server:system
*.googleapis.com = server:system

[MITM]
# 默认不启用 MITM。
# 如需 HTTPS 解密，请在 Surge 中生成并信任证书后，再按需添加 hostname。
# hostname = *.example.com
